<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="usbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.5"/>

  <!-- USB Plug Silhouette -->
  <g filter="url(#dropShadow)">
    <!-- USB Metal Connector -->
    <rect x="206" y="112" width="100" height="90" rx="12" fill="#94a3b8"/>
    <rect x="210" y="116" width="92" height="82" rx="8" fill="#e2e8f0"/>
    <!-- Connector Holes -->
    <rect x="226" y="136" width="22" height="26" rx="4" fill="#334155"/>
    <rect x="264" y="136" width="22" height="26" rx="4" fill="#334155"/>

    <!-- USB Body / Flash Drive Handle -->
    <rect x="176" y="186" width="160" height="214" rx="32" fill="url(#usbGrad)"/>

    <!-- Rocket / Lightning Rudy Accent Emblem -->
    <path d="M256 226 L278 286 L252 286 L266 346 L234 296 L258 296 Z" fill="#2563eb"/>
  </g>
</svg>
